name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=style

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      # Lints this repo's CI and every example workflow customers copy.
      - name: Lint workflows
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 ./actionlint -color

  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate skills and ZIP bundles
        run: bash scripts/check-skills.sh

  banner:
    name: Banner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Pillow
        run: python -m pip install --quiet pillow==12.2.0
      - name: Regenerate and compare
        run: |
          python3 scripts/banner.py
          git diff --exit-code assets/ || {
            echo "::error::assets/ is out of date. Run python3 scripts/banner.py and commit the result."
            exit 1
          }
